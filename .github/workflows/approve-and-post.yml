name: Approve and Post (SLOT_1)

# GitHub Issueに「承認」とコメントすると即時投稿される
on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  post:
    # daily-operationラベルのIssueへのコメントで、「承認」を含み、Botでなく、「申請」を含まない場合のみ実行
    # 「SLOT_1却下」が含まれる場合はSLOT_1をスキップ（cron側のron_scheduled_post.pyが却下を検知する）
    if: |
      contains(github.event.issue.labels.*.name, 'daily-operation') &&
      contains(github.event.comment.body, '承認') &&
      !contains(github.event.comment.body, '申請') &&
      !contains(github.event.comment.body, 'SLOT_1却下') &&
      github.event.comment.user.type != 'Bot' &&
      (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'COLLABORATOR' || github.event.comment.author_association == 'MEMBER')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Confirm approval received
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"body": "✅ 承認を受け付けました。SLOT_1は15時に自動投稿されます。"}' \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments"
